name: Test and publish Pages redirect
# The game lives on Vercel (https://scioly-dive.vercel.app/), which deploys main by itself.
# GitHub Pages only serves pages-redirect/index.html (also as 404.html, so old deep links forward too).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: |
          mkdir -p redirect-dist
          cp pages-redirect/index.html redirect-dist/index.html
          cp pages-redirect/index.html redirect-dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect-dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
